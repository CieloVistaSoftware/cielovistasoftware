<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Every public CieloVista Software project — live sites and source code.">
    <title>Projects - CieloVista Software</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#1a1a1a">
    <meta property="og:title" content="Projects - CieloVista Software">
    <meta property="og:description" content="Every public CieloVista Software project — live sites and source code.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cielovistasoftware.com/projects.html">
    <meta property="og:image" content="https://cielovistasoftware.com/og-image.png">
    <meta property="og:image:alt" content="CieloVista Software: web, mobile and cloud software">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="CieloVista Software">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/CieloVistaSoftware/wb-starter@a7d9d012b02b5d65c7f1ff4aad0ab3374788fd39/src/styles/normalize.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/CieloVistaSoftware/wb-starter@a7d9d012b02b5d65c7f1ff4aad0ab3374788fd39/src/styles/themes.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/CieloVistaSoftware/wb-starter@a7d9d012b02b5d65c7f1ff4aad0ab3374788fd39/src/styles/site.css">
    <link rel="stylesheet" href="list-table.css">
    <script type="module">
        import WB from 'https://cdn.jsdelivr.net/gh/CieloVistaSoftware/wb-starter@a7d9d012b02b5d65c7f1ff4aad0ab3374788fd39/src/core/wb.js';
        WB.init();
    </script>
</head>
<body>
    <nav x-navbar sticky brand="CieloVista Software" tagline="Creating Ads? A breeze" brandHref="index.html"
         items="Home:index.html,About:index.html#about,Services:index.html#services,Articles:articles.html,Projects:projects.html,Contact:index.html#contact"></nav>
    <div x-container maxWidth="1200px">
        <div x-themecontrol></div>
    </div>

    <main x-container maxWidth="1200px" wrap="false">
        <section>
            <h1>Projects</h1>
            <p>Every public repository on <a href="https://github.com/CieloVistaSoftware" target="_blank" rel="noopener">GitHub</a>,
               listed live. Projects with a published site come first.</p>
        </section>

        <section id="projects">
            <div class="list-table__bar">
                <input type="search" id="projectSearch" class="list-table__filter" placeholder="Filter by name, description or language" aria-label="Filter projects" autocomplete="off">
                <label><input type="checkbox" id="showForks"> Include forks</label>
                <span id="projectStatus" class="list-table__count" aria-live="polite">Loading…</span>
            </div>
            <div class="list-table__wrap">
                <table class="list-table__table" id="projects-table">
                    <thead>
                        <tr><th>Name</th><th>Description</th><th>Language</th><th>Updated</th><th>Stars</th><th>Site</th></tr>
                    </thead>
                    <tbody id="projects-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="site__footer">
        <div class="footer__content">
            <div class="footer__left"><span>&copy; 2026 CieloVista Software. All rights reserved.</span></div>
        </div>
    </footer>

    <script type="module" src="projects.js"></script>
</body>
</html>
