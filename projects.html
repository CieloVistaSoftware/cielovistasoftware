<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Every public CieloVista Software project — live sites and source code.">
    <title>Projects - CieloVista Software</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wb-starter@1.0.1/src/styles/normalize.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wb-starter@1.0.1/src/styles/themes.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wb-starter@1.0.1/src/styles/site.css">
    <link rel="stylesheet" href="list-table.css">
    <script type="module">
        import WB from 'https://cdn.jsdelivr.net/npm/wb-starter@1.0.1/src/core/wb.js';
        WB.init();
    </script>
</head>
<body>
    <nav x-navbar sticky brand="CieloVista Software" tagline="Creating Ads? A breeze" brandHref="index.html"
         items="Home:index.html,About:index.html#about,Services:index.html#services,Articles:articles.html,Projects:projects.html,Contact:index.html#contact"></nav>
    <div x-container maxWidth="1200px">
        <div x-themecontrol></div>
    </div>

    <main x-container maxWidth="1200px" wrap="false">
        <section>
            <h1>Projects</h1>
            <p>Every public repository on <a href="https://github.com/CieloVistaSoftware" target="_blank" rel="noopener">GitHub</a>,
               listed live. Projects with a published site come first.</p>
        </section>

        <section id="projects">
            <div class="list-table__bar">
                <input type="search" id="projectSearch" class="list-table__filter" placeholder="Filter by name, description or language" aria-label="Filter projects" autocomplete="off">
                <label><input type="checkbox" id="showForks"> Include forks</label>
                <span id="projectStatus" class="list-table__count" aria-live="polite">Loading…</span>
            </div>
            <div class="list-table__wrap">
                <table class="list-table__table" id="projects-table">
                    <thead>
                        <tr><th>Name</th><th>Description</th><th>Language</th><th>Updated</th><th>Stars</th><th>Site</th></tr>
                    </thead>
                    <tbody id="projects-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="site__footer">
        <div class="footer__content">
            <div class="footer__left"><span>&copy; 2026 CieloVista Software. All rights reserved.</span></div>
        </div>
    </footer>

    <script type="module" src="projects.js"></script>
</body>
</html>
